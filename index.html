<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Blood on the Clocktower — Download</title>
  <meta name="description" content="Download the Blood on the Clocktower companion app for iPhone, iPad and Android." />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#08090f" />
  <link rel="icon" href="assets/app-icon.png" />

  <!-- The app's own faces: Cinzel for display, IM Fell English for body. Matches the
       gothic theme bundle in @botc/shared (fontDisplay / fontBody). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&display=swap"
    rel="stylesheet" />

  <style>
    /* Palette lifted verbatim from GOTHIC_TOKENS in @botc/shared so this page and the app
       are the same night. Do not hand-pick new colours here — copy them from the token file. */
    :root {
      --app-bg: #08090f;
      --ink: #120d0a;
      --parchment: #e8dcc0;
      --bone: #f3ecdd;
      --text: #f3ecdd;
      --muted: #9a958c;
      --faint: #6b6660;
      --gold: #d9a441;
      --gold-light: #f1cd76;
      --gold-dark: #a87a28;
      --line: rgba(217, 164, 65, 0.22);
      --display: 'Cinzel', 'Times New Roman', serif;
      --deco: 'Cinzel Decorative', 'Cinzel', serif;
      --body: 'IM Fell English', Georgia, serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      background: var(--app-bg);
      color: var(--text);
      font-family: var(--body);
      font-size: 17px;
      line-height: 1.6;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ---- The night over Ravenswood Bluff -------------------------------------------------
       Fixed to the viewport so the sky holds still while the page scrolls under it, exactly
       like NightSky in the app. Stars are CSS circles (not SVG) so they stay round at every
       viewport ratio, and they are seeded, so it is the same sky on every reload.
       There is deliberately no skyline: a clocktower here stood in the middle of the screen
       and cut through whatever content happened to scroll past it. */
    .sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .sky-wash {
      position: absolute; inset: 0;
      background:
        radial-gradient(70% 50% at 50% 4%, rgba(217, 164, 65, 0.09), transparent 70%),
        radial-gradient(70% 50% at 12% 8%, rgba(58, 53, 80, 0.5), transparent 70%),
        linear-gradient(160deg, #11131f 0%, #08090f 60%, #05060b 100%);
    }
    .star { position: absolute; border-radius: 50%; background: #f3ecdd; }

    .vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(120% 130% at 50% -10%, transparent 52%, rgba(0, 0, 0, 0.62) 100%);
    }

    /* ---- Page ---- */
    .wrap {
      position: relative; z-index: 2;
      width: 100%; max-width: 720px; margin: 0 auto;
      padding: clamp(2.5rem, 10vw, 4rem) 1.25rem clamp(3rem, 10vw, 4.5rem);
    }

    /* ---- Hero ---- */
    .hero { text-align: center; }
    .crest {
      width: clamp(88px, 20vw, 112px); height: clamp(88px, 20vw, 112px);
      border-radius: 24%; display: block; margin: 0 auto 1.15rem;
      box-shadow: 0 0 0 1px var(--line), 0 0 34px rgba(217, 164, 65, 0.22);
    }
    /* The wordmark is STACKED — Blood / on the / Clocktower — the same three-line lockup the
       app itself uses. Set on one line it either shrinks to nothing or wraps at whatever point
       the viewport happens to choose, and neither reads as a title. */
    h1 {
      font-family: var(--deco); font-weight: 700;
      margin: 0; text-transform: uppercase;
      display: flex; flex-direction: column; align-items: center; line-height: 1.02;
      background: linear-gradient(180deg, var(--bone) 0%, var(--gold) 125%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .wm-lg { font-size: clamp(1.7rem, 7.6vw, 2.7rem); letter-spacing: 0.07em; padding-left: 0.07em; }
    .wm-sm {
      font-family: var(--display); font-weight: 500;
      font-size: clamp(0.62rem, 2.5vw, 0.86rem);
      letter-spacing: 0.42em; padding-left: 0.42em;
      margin: 0.34em 0 0.28em;
    }

    /* A hairline rule with a lozenge — the app's own divider. */
    .rule {
      display: flex; align-items: center; justify-content: center; gap: 0.75rem;
      margin: clamp(2rem, 7vw, 2.8rem) auto; max-width: 400px;
    }
    .rule::before, .rule::after {
      content: ''; height: 1px; flex: 1;
      background: linear-gradient(90deg, transparent, rgba(217, 164, 65, 0.35), transparent);
    }
    .rule span { color: var(--gold); font-size: 0.6rem; }

    /* ---- The invite (only when ?game=CODE) --------------------------------------------
       The CODE is the whole point of this screen for an invited player, so it is the
       largest thing on it and carries no container of its own. */
    .invite { text-align: center; margin: clamp(2rem, 7vw, 2.6rem) auto 0; max-width: 30em; }
    .invite-eyebrow {
      font-family: var(--display); color: var(--muted);
      font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; margin: 0;
    }
    .invite-code {
      font-family: var(--display); font-weight: 700;
      font-size: clamp(2.4rem, 12vw, 3.6rem);
      letter-spacing: 0.26em; padding-left: 0.26em;
      color: var(--gold-light);
      text-shadow: 0 0 30px rgba(217, 164, 65, 0.4);
      margin: 0.3rem 0 1.2rem;
    }
    .invite-open { max-width: 22rem; }

    /* ---- Platform columns --------------------------------------------------------------
       No cards. Two columns divided by a hairline; the panel appears only on the visitor's
       own platform, which is the one piece of state worth drawing a boundary around. */
    .platforms {
      display: grid; grid-template-columns: 1fr 1px 1fr;
      align-items: start; gap: clamp(0.9rem, 4vw, 2rem);
    }
    .divider { align-self: stretch; background: linear-gradient(180deg, transparent, var(--line), transparent); }
    @media (max-width: 600px) {
      .platforms { grid-template-columns: 1fr; gap: 2.6rem; }
      .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); }
    }

    .platform { text-align: center; padding: 1.1rem 0.6rem 1.2rem; border-radius: 14px; }
    .platform.detected {
      background: rgba(217, 164, 65, 0.05);
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .badge {
      display: none; margin: 0 0 0.5rem;
      font-family: var(--display); font-size: 0.6rem; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold);
    }
    .platform.detected .badge { display: block; }
    .platform h2 {
      font-family: var(--display); font-weight: 700;
      font-size: clamp(1.05rem, 4vw, 1.2rem); letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--parchment); margin: 0 0 1rem;
    }

    /* The QR stays on a light ground — contrast is what makes it scan. Parchment, framed in
       gold, so it reads as a page from the grimoire rather than a white sticker. */
    .qr-box {
      background: var(--bone); border-radius: 10px; padding: 11px;
      width: 168px; height: 168px; margin: 0 auto 1.15rem;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 1px var(--gold-dark), 0 14px 34px rgba(0, 0, 0, 0.55);
    }
    .qr-box svg { width: 100%; height: 100%; display: block; }
    .qr-box.empty {
      background: rgba(243, 236, 221, 0.04); box-shadow: inset 0 0 0 1px var(--line);
      color: var(--faint); font-family: var(--body); font-size: 0.82rem;
      line-height: 1.45; padding: 1rem; text-align: center;
    }

    .btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; max-width: 15rem; margin: 0 auto;
      padding: 0.82rem 1rem; border: 0; border-radius: 11px;
      font-family: var(--display); font-weight: 700; font-size: 0.92rem;
      letter-spacing: 0.09em; text-transform: uppercase; text-decoration: none;
      color: var(--ink); cursor: pointer;
      background: linear-gradient(135deg, var(--gold-light), var(--gold) 55%, var(--gold-dark));
      box-shadow: 0 10px 26px -12px rgba(217, 164, 65, 0.75);
      transition: filter 0.2s, transform 0.12s;
    }
    .btn:hover { filter: brightness(1.07); }
    .btn:active { transform: translateY(1px); }
    .btn[aria-disabled="true"] {
      background: none; box-shadow: inset 0 0 0 1px var(--line);
      color: var(--faint); pointer-events: none;
    }

    @media (prefers-reduced-motion: no-preference) {
      .crest, h1 { animation: rise 0.7s ease-out both; }
      h1 { animation-delay: 0.05s; }
    }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="sky-wash"></div>
    <div id="stars"></div>
  </div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="wrap">
    <header class="hero">
      <img class="crest" src="assets/app-icon.png" alt="" />
      <h1>
        <span class="wm-lg">Blood</span>
        <span class="wm-sm">on the</span>
        <span class="wm-lg">Clocktower</span>
      </h1>
    </header>

    <section class="invite" id="invite" hidden>
      <p class="invite-eyebrow">You're invited to a game</p>
      <div class="invite-code" id="invite-code"></div>
      <a class="btn invite-open" id="invite-open" href="#">Open in the app</a>
    </section>

    <div class="rule" aria-hidden="true"><span>◆</span></div>

    <main class="platforms">
      <section class="platform" id="card-ios">
        <p class="badge">Your device</p>
        <h2>iPhone &amp; iPad</h2>
        <div class="qr-box" id="qr-ios"></div>
        <a class="btn" id="btn-ios" href="#">Open in App Store</a>
      </section>

      <div class="divider" aria-hidden="true"></div>

      <section class="platform" id="card-android">
        <p class="badge">Your device</p>
        <h2>Android</h2>
        <div class="qr-box" id="qr-android"></div>
        <a class="btn" id="btn-android" href="#">Download APK</a>
      </section>
    </main>
  </div>

  <script src="vendor/qrcode.min.js"></script>
  <script src="config.js"></script>
  <script>
    (function () {
      var cfg = window.BOTC_CONFIG || {};

      // ---- Starfield ----------------------------------------------------------------
      // Seeded (xorshift), never Math.random: the sky must be the same sky on every load
      // rather than reshuffling itself. CSS circles, so they stay round at any viewport
      // ratio — an SVG stretched to the window smears every star into an ellipse.
      (function stars() {
        var host = document.getElementById('stars');
        if (!host) return;
        var seed = 0x1a2b3c4d;
        function rnd() {
          seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;
          return ((seed >>> 0) % 100000) / 100000;
        }
        var frag = document.createDocumentFragment();
        for (var i = 0; i < 90; i++) {
          var s = document.createElement('div');
          var size = rnd() < 0.86 ? 1 : 2;
          s.className = 'star';
          s.style.width = size + 'px';
          s.style.height = size + 'px';
          s.style.left = (rnd() * 100).toFixed(3) + '%';
          s.style.top = (rnd() * 100).toFixed(3) + '%';
          s.style.opacity = (0.2 + rnd() * 0.55).toFixed(2);
          frag.appendChild(s);
        }
        host.appendChild(frag);
      })();

      // ---- Game invite: ?game=CODE (the QR people scan with a normal camera) ----
      var gameCode = null;
      try { gameCode = new URLSearchParams(window.location.search).get('game'); } catch (e) {}
      if (gameCode) gameCode = gameCode.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
      if (gameCode) {
        document.getElementById('invite-code').textContent = gameCode;
        document.getElementById('invite-open').href = 'botc://join?game=' + encodeURIComponent(gameCode);
        document.getElementById('invite').hidden = false;
        document.title = 'Join game ' + gameCode + ' — ' + (cfg.appName || 'Blood on the Clocktower');
      }

      // ---- QR rendering (qrcode-generator, MIT, vendored) ----
      function renderQR(el, text) {
        try {
          var qr = qrcode(0, 'M');
          qr.addData(text);
          qr.make();
          el.innerHTML = qr.createSvgTag({ cellSize: 6, margin: 1, scalable: true });
        } catch (e) {
          el.classList.add('empty');
          el.textContent = 'Could not render QR.';
        }
      }

      function setup(opts) {
        var card = document.getElementById(opts.cardId);
        var qrEl = document.getElementById(opts.qrId);
        var btn = document.getElementById(opts.btnId);
        var url = (opts.url || '').trim();

        if (url) {
          renderQR(qrEl, url);
          btn.href = url;
          if (opts.download) btn.setAttribute('download', '');
          // open App Store / external links in a new tab from desktop
          if (!opts.download) { btn.target = '_blank'; btn.rel = 'noopener'; }
        } else {
          qrEl.classList.add('empty');
          qrEl.textContent = opts.comingSoon;
          btn.textContent = 'Coming soon';
          btn.setAttribute('aria-disabled', 'true');
          btn.href = '#';
        }
        return card;
      }

      var iosCard = setup({
        cardId: 'card-ios', qrId: 'qr-ios', btnId: 'btn-ios',
        url: cfg.iosUrl, download: false,
        comingSoon: 'iOS link goes live once the app clears App Review.'
      });
      var androidCard = setup({
        cardId: 'card-android', qrId: 'qr-android', btnId: 'btn-android',
        url: cfg.androidUrl, download: true,
        comingSoon: 'Android build is on the way.'
      });

      // ---- Highlight the visitor's platform ----
      var ua = navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /android/i.test(ua);
      if (isIOS) iosCard.classList.add('detected');
      else if (isAndroid) androidCard.classList.add('detected');
    })();
  </script>
</body>
</html>
