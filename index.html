<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Blood on the Clocktower — Download</title>
  <meta name="description" content="Download the Blood on the Clocktower companion app for iPhone, iPad and Android." />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#08090f" />
  <link rel="icon" href="assets/app-icon.png" />

  <!-- The app's own faces: Cinzel for display, IM Fell English for body. Matches the
       gothic theme bundle in @botc/shared (fontDisplay / fontBody). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&display=swap"
    rel="stylesheet" />

  <style>
    /* Palette lifted verbatim from GOTHIC_TOKENS in @botc/shared so this page and the app
       are the same night. Do not hand-pick new colours here — copy them from the token file. */
    :root {
      --app-bg: #08090f;
      --ink: #120d0a;
      --bone: #f3ecdd;
      --text: #f3ecdd;
      --muted: #9a958c;
      --gold: #d9a441;
      --gold-light: #f1cd76;
      --gold-dark: #a87a28;
      --line: rgba(217, 164, 65, 0.28);
      --display: 'Cinzel', 'Times New Roman', serif;
      --deco: 'Cinzel Decorative', 'Cinzel', serif;
      --body: 'IM Fell English', Georgia, serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      background: var(--app-bg);
      color: var(--text);
      font-family: var(--body);
      font-size: 17px;
      line-height: 1.6;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ---- The night over Ravenswood Bluff -------------------------------------------------
       Fixed to the viewport so the sky holds still while the page scrolls under it, exactly
       like NightSky in the app. Stars are CSS circles (not SVG) so they stay round at every
       viewport ratio, and they are seeded, so it is the same sky on every reload. */
    .sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .sky-wash {
      position: absolute; inset: 0;
      background:
        radial-gradient(70% 50% at 50% 4%, rgba(217, 164, 65, 0.09), transparent 70%),
        radial-gradient(70% 50% at 12% 8%, rgba(58, 53, 80, 0.5), transparent 70%),
        linear-gradient(160deg, #11131f 0%, #08090f 60%, #05060b 100%);
    }
    .star { position: absolute; border-radius: 50%; background: #f3ecdd; }

    .vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(120% 130% at 50% -10%, transparent 52%, rgba(0, 0, 0, 0.62) 100%);
    }

    /* ---- Page ----
       The whole page is one centred column: the crest, the wordmark, and the actions. There
       is no QR here on purpose — everyone who reaches this page arrived by scanning one. */
    .wrap {
      position: relative; z-index: 2;
      width: 100%; max-width: 26rem; margin: 0 auto;
      padding: clamp(2.5rem, 9vw, 4rem) 1.4rem clamp(2.5rem, 9vw, 4rem);
      text-align: center;
    }

    .crest {
      width: clamp(92px, 22vw, 118px); height: clamp(92px, 22vw, 118px);
      border-radius: 24%; display: block; margin: 0 auto 1.25rem;
      box-shadow: 0 0 0 1px var(--line), 0 0 34px rgba(217, 164, 65, 0.22);
    }

    /* The wordmark is STACKED — Blood / on the / Clocktower — the same three-line lockup the
       app itself uses. Set on one line it either shrinks to nothing or wraps at whatever point
       the viewport happens to choose, and neither reads as a title. */
    h1 {
      font-family: var(--deco); font-weight: 700;
      margin: 0; text-transform: uppercase;
      display: flex; flex-direction: column; align-items: center; line-height: 1.02;
      background: linear-gradient(180deg, var(--bone) 0%, var(--gold) 125%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .wm-lg { font-size: clamp(1.7rem, 7.6vw, 2.5rem); letter-spacing: 0.07em; padding-left: 0.07em; }
    .wm-sm {
      font-family: var(--display); font-weight: 500;
      font-size: clamp(0.62rem, 2.5vw, 0.82rem);
      letter-spacing: 0.42em; padding-left: 0.42em;
      margin: 0.34em 0 0.28em;
    }

    /* A hairline rule with a lozenge — the app's own divider. */
    .rule {
      display: flex; align-items: center; justify-content: center; gap: 0.75rem;
      margin: clamp(1.8rem, 6vw, 2.4rem) auto;
    }
    .rule::before, .rule::after {
      content: ''; height: 1px; flex: 1;
      background: linear-gradient(90deg, transparent, rgba(217, 164, 65, 0.35), transparent);
    }
    .rule span { color: var(--gold); font-size: 0.6rem; }

    /* ---- Actions ------------------------------------------------------------------------
       A single stack. The visitor's own platform is ordered first and takes the solid gold
       plate; the other store stays available as a hairline ghost, so there is one obvious
       thing to press rather than two competing golds. */
    .actions { display: flex; flex-direction: column; gap: 0.85rem; }

    .btn {
      position: relative;
      display: flex; align-items: center; justify-content: center; gap: 0.7rem;
      width: 100%; padding: 1rem 1.15rem;
      border: 0; border-radius: 13px;
      font-family: var(--display); font-weight: 700;
      font-size: clamp(0.86rem, 3.4vw, 0.98rem);
      letter-spacing: 0.09em; text-transform: uppercase; text-decoration: none;
      cursor: pointer; overflow: hidden;
      transition: filter 0.2s, transform 0.12s, box-shadow 0.2s, border-color 0.2s;
    }
    .btn svg { width: 1.25em; height: 1.25em; flex: none; fill: currentColor; }
    .btn:active { transform: translateY(1px); }
    /* `display: flex` above beats the UA stylesheet's `[hidden] { display: none }`, so without
       this the deep-link button shows on every visit — including the ones with no game code,
       where it links nowhere. */
    .btn[hidden] { display: none; }

    /* Solid gold plate, with a struck highlight along its top edge so it reads as pressed
       metal rather than a flat fill. */
    .btn.is-solid {
      color: var(--ink);
      background: linear-gradient(140deg, var(--gold-light), var(--gold) 52%, var(--gold-dark));
      box-shadow: 0 12px 30px -14px rgba(217, 164, 65, 0.85), 0 0 0 1px rgba(255, 236, 190, 0.3);
    }
    .btn.is-solid::before {
      content: ''; position: absolute; inset: 0 0 auto; height: 45%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.34), transparent);
      pointer-events: none;
    }
    .btn.is-solid:hover { filter: brightness(1.07); }

    .btn.is-ghost {
      color: var(--gold-light);
      background: rgba(217, 164, 65, 0.045);
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .btn.is-ghost:hover {
      background: rgba(217, 164, 65, 0.1);
      box-shadow: inset 0 0 0 1px rgba(217, 164, 65, 0.5);
    }

    .btn[aria-disabled="true"] {
      color: var(--muted); background: none;
      box-shadow: inset 0 0 0 1px rgba(154, 149, 140, 0.25);
      pointer-events: none;
    }
    .btn[aria-disabled="true"]::before { display: none; }

    @media (prefers-reduced-motion: no-preference) {
      .crest, h1 { animation: rise 0.7s ease-out both; }
      h1 { animation-delay: 0.05s; }
    }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="sky-wash"></div>
    <div id="stars"></div>
  </div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="wrap">
    <img class="crest" src="assets/app-icon.png" alt="" />
    <h1>
      <span class="wm-lg">Blood</span>
      <span class="wm-sm">on the</span>
      <span class="wm-lg">Clocktower</span>
    </h1>

    <div class="rule" aria-hidden="true"><span>◆</span></div>

    <div class="actions">
      <!-- Only when the page was opened with ?game=CODE. The code itself is not printed:
           the deep link already carries it, and this page is reached by scanning the game's
           own QR, so the player never has to read or retype it. -->
      <a class="btn is-solid" id="invite-open" href="#" hidden>Open in the app</a>

      <a class="btn" id="btn-ios" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.365 1.43c0 1.14-.42 2.2-1.12 3.02-.85.99-2.24 1.76-3.38 1.67-.14-1.1.4-2.26 1.06-3.03.75-.87 2.06-1.55 3.44-1.66zM20.9 17.4c-.55 1.27-.81 1.84-1.52 2.96-.99 1.56-2.39 3.5-4.12 3.51-1.54.02-1.94-1-4.03-.99-2.09.01-2.53 1.01-4.07.99-1.73-.02-3.05-1.77-4.04-3.33C.35 16.2-.02 11.1 1.66 8.44c1.2-1.9 3.09-3.01 4.87-3.01 1.81 0 2.95 1 4.45 1 1.45 0 2.34-1 4.43-1 1.58 0 3.26.86 4.45 2.35-3.91 2.14-3.27 7.72 1.04 9.62z"/></svg>
        <span>Open in App Store</span>
      </a>

      <a class="btn" id="btn-android" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18c0 .55.45 1 1 1h1v3.5a1.5 1.5 0 0 0 3 0V19h2v3.5a1.5 1.5 0 0 0 3 0V19h1c.55 0 1-.45 1-1V8H6v10zM3.5 8A1.5 1.5 0 0 0 2 9.5v7a1.5 1.5 0 0 0 3 0v-7A1.5 1.5 0 0 0 3.5 8zm17 0A1.5 1.5 0 0 0 19 9.5v7a1.5 1.5 0 0 0 3 0v-7A1.5 1.5 0 0 0 20.5 8zm-4.97-5.84 1.3-1.3a.5.5 0 0 0-.71-.71l-1.48 1.48A6.9 6.9 0 0 0 12 1c-.96 0-1.86.23-2.66.63L7.85.15a.5.5 0 1 0-.71.71l1.31 1.31A5.9 5.9 0 0 0 6 7h12a5.9 5.9 0 0 0-2.47-4.84zM10 5H9V4h1v1zm5 0h-1V4h1v1z"/></svg>
        <span>Download for Android</span>
      </a>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    (function () {
      var cfg = window.BOTC_CONFIG || {};

      // ---- Starfield ----------------------------------------------------------------
      // Seeded (xorshift), never Math.random: the sky must be the same sky on every load
      // rather than reshuffling itself. CSS circles, so they stay round at any viewport
      // ratio — an SVG stretched to the window smears every star into an ellipse.
      (function stars() {
        var host = document.getElementById('stars');
        if (!host) return;
        var seed = 0x1a2b3c4d;
        function rnd() {
          seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;
          return ((seed >>> 0) % 100000) / 100000;
        }
        var frag = document.createDocumentFragment();
        for (var i = 0; i < 90; i++) {
          var s = document.createElement('div');
          var size = rnd() < 0.86 ? 1 : 2;
          s.className = 'star';
          s.style.width = size + 'px';
          s.style.height = size + 'px';
          s.style.left = (rnd() * 100).toFixed(3) + '%';
          s.style.top = (rnd() * 100).toFixed(3) + '%';
          s.style.opacity = (0.2 + rnd() * 0.55).toFixed(2);
          frag.appendChild(s);
        }
        host.appendChild(frag);
      })();

      // ---- Game invite: ?game=CODE (the QR people scan with a normal camera) ----
      var gameCode = null;
      try { gameCode = new URLSearchParams(window.location.search).get('game'); } catch (e) {}
      if (gameCode) gameCode = gameCode.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
      if (gameCode) {
        var open = document.getElementById('invite-open');
        open.href = 'botc://join?game=' + encodeURIComponent(gameCode);
        open.hidden = false;
        document.title = 'Join game ' + gameCode + ' — ' + (cfg.appName || 'Blood on the Clocktower');
      }

      function setup(btn, url, isDownload, soon) {
        url = (url || '').trim();
        if (!url) {
          btn.querySelector('span').textContent = soon;
          btn.setAttribute('aria-disabled', 'true');
          btn.href = '#';
          return false;
        }
        btn.href = url;
        if (isDownload) btn.setAttribute('download', '');
        else { btn.target = '_blank'; btn.rel = 'noopener'; }
        return true;
      }

      var ios = document.getElementById('btn-ios');
      var android = document.getElementById('btn-android');
      var iosLive = setup(ios, cfg.iosUrl, false, 'App Store coming soon');
      var androidLive = setup(android, cfg.androidUrl, true, 'Android coming soon');

      // ---- Lead with the visitor's own platform ----
      var ua = navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /android/i.test(ua);

      function dress(primary, secondary) {
        if (!primary.hasAttribute('aria-disabled')) primary.classList.add('is-solid');
        if (!secondary.hasAttribute('aria-disabled')) secondary.classList.add('is-ghost');
        primary.parentNode.insertBefore(primary, secondary);
      }
      if (isIOS) dress(ios, android);
      else if (isAndroid) dress(android, ios);
      else {
        // No idea what this is (a desktop): give both equal weight.
        if (iosLive) ios.classList.add('is-solid');
        if (androidLive) android.classList.add('is-solid');
      }
    })();
  </script>
</body>
</html>
